<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MG Plants | Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 flex h-screen overflow-hidden font-sans text-gray-800">

  <!-- SIDEBAR -->
  <aside class="w-64 bg-[#0f172a] text-white flex flex-col hidden md:flex">
    <div class="h-16 flex items-center px-6 border-b border-gray-700">
      <span class="text-xl">🌿</span>
      <span class="text-lg font-bold ml-2">MG Plants Admin</span>
    </div>
    <nav class="flex-1 px-4 py-6 space-y-2">
      <a href="#" id="sidebar-inventory" onclick="switchTab('inventory')" class="flex items-center px-4 py-3 bg-emerald-600 text-white rounded-lg transition"><i class="fa-solid fa-boxes-stacked w-6"></i> Manage Inventory</a>
      <a href="#" id="sidebar-orders" onclick="switchTab('orders')" class="flex items-center px-4 py-3 text-gray-400 hover:bg-gray-800 hover:text-white rounded-lg transition"><i class="fa-solid fa-truck-fast w-6"></i> Live Orders</a>
      <a href="/index.html" class="flex items-center px-4 py-3 text-gray-400 hover:bg-gray-800 hover:text-white rounded-lg transition mt-10"><i class="fa-solid fa-store w-6"></i> View Storefront</a>
    </nav>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="flex-1 flex flex-col h-screen overflow-hidden">
    <!-- Header -->
    <header class="h-16 bg-white shadow-sm flex items-center justify-between px-6 z-10">
      <h2 id="page-title" class="text-xl font-bold text-gray-800">Manage Inventory & Pricing</h2>
      <button onclick="openProductModal()" id="add-btn" class="bg-emerald-700 hover:bg-emerald-800 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-sm transition flex items-center"><i class="fa-solid fa-plus mr-2"></i> Add New Product</button>
    </header>

    <!-- Content Area -->
    <div class="flex-1 overflow-y-auto p-6">
      
      <!-- INVENTORY TAB -->
      <div id="inventory-tab" class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-x-auto">
        <table class="w-full text-left border-collapse min-w-[600px]">
          <thead>
            <tr class="bg-gray-50 border-b border-gray-200 text-xs uppercase text-gray-500 font-bold tracking-wider">
              <th class="p-4">Image</th>
              <th class="p-4">Product Name</th>
              <th class="p-4">Category & Stock</th>
              <th class="p-4">Price</th>
              <th class="p-4 text-right">Action</th>
            </tr>
          </thead>
          <tbody id="admin-products-list" class="divide-y divide-gray-100 text-sm">
            <tr><td colspan="5" class="p-6 text-center text-gray-400">Loading products...</td></tr>
          </tbody>
        </table>
      </div>

      <!-- LIVE ORDERS TAB -->
      <div id="orders-tab" class="hidden space-y-4">
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-x-auto">
          <table class="w-full text-left border-collapse min-w-[800px]">
            <thead>
              <tr class="bg-gray-50 border-b border-gray-200 text-xs uppercase text-gray-500 font-bold tracking-wider">
                <th class="p-4">Customer & Tracking</th>
                <th class="p-4">Delivery Address & Issues</th>
                <th class="p-4">Items Ordered</th>
                <th class="p-4">Payment & Total</th>
                <th class="p-4">Order Status</th>
              </tr>
            </thead>
            <tbody id="admin-orders-list" class="divide-y divide-gray-100 text-sm">
              <tr><td colspan="5" class="p-6 text-center text-gray-400">Loading live orders...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <!-- PRODUCT EDIT/ADD MODAL -->
  <div id="admin-product-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl relative max-h-[95vh] overflow-y-auto">
      <button onclick="closeProductModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-700 text-xl"><i class="fa-solid fa-xmark"></i></button>
      
      <h3 id="modal-title" class="text-lg font-bold text-gray-900 mb-4 border-b pb-2">Add/Edit Product</h3>
      
      <form id="product-form" onsubmit="saveProduct(event)" class="space-y-4">
        <input type="hidden" id="prod-id">
        
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">Product Name</label>
          <input type="text" id="prod-name" required class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none text-sm bg-gray-50">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-600 mb-1">Category</label>
            <select id="prod-category" class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none text-sm bg-gray-50">
              <option value="Indoor">Indoor</option>
              <option value="Outdoor">Outdoor</option>
              <option value="Fruits">Fruits</option>
              <option value="Flowers">Flowers</option>
              <option value="Seeds">Seeds</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-600 mb-1">Stock Availability</label>
            <input type="number" id="prod-stock" required min="0" class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none text-sm bg-gray-50">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-600 mb-1">Selling Price (₹)</label>
            <input type="number" id="prod-price" required class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none text-sm bg-gray-50">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-600 mb-1">Original Price (₹)</label>
            <input type="number" id="prod-orig-price" class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none text-sm bg-gray-50">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">Product Description</label>
          <textarea id="prod-desc" rows="3" required class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none text-sm bg-gray-50" placeholder="Enter plant details..."></textarea>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">Image URL</label>
          <input type="url" id="prod-image" required class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none text-sm bg-gray-50">
          <div class="mt-2 text-center">
            <img id="image-preview" src="https://via.placeholder.com/150" class="h-24 w-24 object-cover mx-auto rounded-lg shadow-sm border border-gray-200">
          </div>
        </div>

        <div class="flex items-center">
          <input type="checkbox" id="prod-bestseller" class="h-4 w-4 text-emerald-600 border-gray-300 rounded cursor-pointer">
          <label for="prod-bestseller" class="ml-2 block text-sm text-gray-700 font-bold cursor-pointer">Mark as Best Seller</label>
        </div>

        <div class="flex space-x-3 pt-4 border-t border-gray-200">
          <button type="submit" id="save-btn" class="flex-1 bg-emerald-700 hover:bg-emerald-800 text-white py-2.5 rounded-lg font-bold transition">Save Product</button>
          <button type="button" id="delete-btn" onclick="deleteProduct()" class="hidden flex-1 bg-red-100 hover:bg-red-200 text-red-700 py-2.5 rounded-lg font-bold transition">Delete Product</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const BACKEND_URL = 'https://mgplant-mg-plants-backend-1.onrender.com';
    let adminProducts = [];

    document.addEventListener('DOMContentLoaded', () => { fetchAdminProducts(); fetchAdminOrders(); });

    function switchTab(tab) {
      document.getElementById('inventory-tab').classList.add('hidden');
      document.getElementById('orders-tab').classList.add('hidden');
      document.getElementById('sidebar-inventory').className = "flex items-center px-4 py-3 text-gray-400 hover:bg-gray-800 hover:text-white rounded-lg transition";
      document.getElementById('sidebar-orders').className = "flex items-center px-4 py-3 text-gray-400 hover:bg-gray-800 hover:text-white rounded-lg transition";

      document.getElementById(tab + '-tab').classList.remove('hidden');
      document.getElementById('sidebar-' + tab).className = "flex items-center px-4 py-3 bg-emerald-600 text-white rounded-lg transition";
      
      document.getElementById('page-title').innerText = tab === 'inventory' ? 'Manage Inventory & Pricing' : 'Live Orders Management';
      document.getElementById('add-btn').style.display = tab === 'inventory' ? 'flex' : 'none';
      
      if (tab === 'orders') fetchAdminOrders();
    }

    async function fetchAdminProducts() {
      const res = await fetch(`${BACKEND_URL}/api/products`);
      adminProducts = await res.json();
      renderAdminProducts();
    }

    function renderAdminProducts() {
      const tbody = document.getElementById('admin-products-list');
      if (adminProducts.length === 0) { tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-gray-500">No products found.</td></tr>`; return; }
      tbody.innerHTML = adminProducts.map(p => `
        <tr class="hover:bg-gray-50 transition">
          <td class="p-4"><img src="${p.image}" class="w-12 h-12 rounded object-cover border"></td>
          <td class="p-4 font-bold text-gray-800">${p.name} ${p.bestSeller ? '<span class="ml-2 text-[10px] bg-yellow-100 text-yellow-800 px-2 py-0.5 rounded-full">Best Seller</span>' : ''}</td>
          <td class="p-4"><div class="text-xs font-semibold text-emerald-700 bg-emerald-50 px-2 py-1 rounded uppercase inline-block">${p.category}</div><div class="text-xs text-gray-500 mt-1">Stock: ${p.stockCount ?? 10}</div></td>
          <td class="p-4 font-bold text-gray-900">₹${p.price}</td>
          <td class="p-4 text-right"><button onclick="openProductModal('${p.id}')" class="bg-gray-800 text-white px-4 py-1.5 rounded text-xs font-bold">Edit</button></td>
        </tr>
      `).join('');
    }

    // --- LIVE ORDERS MANAGEMENT (EXACT DATE & TIME) ---
    async function fetchAdminOrders() {
      const tbody = document.getElementById('admin-orders-list');
      tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-gray-400">Loading live orders...</td></tr>`;
      const res = await fetch(`${BACKEND_URL}/api/admin/orders`);
      const orders = await res.json();
      
      if (orders.length === 0) { tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-gray-500">No live orders found.</td></tr>`; return; }

      tbody.innerHTML = orders.map(o => {
        // Formats to exact date and time (e.g., 8/22/2026, 4:06 PM)
        const orderDateTime = o.createdAt ? new Date(o.createdAt).toLocaleString() : '';

        return `
          <tr class="hover:bg-gray-50 transition align-top">
            <td class="p-4">
              <div class="font-bold text-gray-900">${o.customerName}</div>
              <div class="text-xs text-gray-600"><i class="fa-solid fa-phone mr-1"></i>${o.phone}</div>
              <div class="text-xs font-bold text-emerald-800 mt-1"><i class="fa-solid fa-box mr-1"></i>${o.trackingId}</div>
              <div class="text-[10px] text-gray-400 mt-0.5">Ordered: ${orderDateTime}</div>
            </td>
            <td class="p-4 text-xs text-gray-600 max-w-xs">
              ${o.address}
              ${o.returnReason ? `<div class="mt-2 text-amber-700 bg-amber-50 p-2 rounded"><strong>ARTO Return Issue:</strong> ${o.returnReason} ${o.returnImage ? `<br><a href="${o.returnImage}" target="_blank" class="text-blue-600 underline">View Photo Proof</a>` : ''}</div>` : ''}
              ${o.refundReason ? `<div class="mt-2 text-blue-700 bg-blue-50 p-2 rounded"><strong>Refund Issue:</strong> ${o.refundReason} ${o.refundImage ? `<br><a href="${o.refundImage}" target="_blank" class="text-blue-600 underline">View Photo Proof</a>` : ''}</div>` : ''}
            </td>
            <td class="p-4 text-xs">${(o.items || []).map(i => `<div>&bull; ${i.name} (&times;${i.quantity})</div>`).join('')}</td>
            <td class="p-4">
              <div class="font-extrabold text-gray-900">₹${o.totalAmount}</div>
              <select onchange="updatePaymentStatus('${o._id}', this.value)" class="text-[11px] font-semibold mt-1 px-2 py-1 rounded border bg-white outline-none">
                <option value="Payment Under Review" ${o.paymentStatus === 'Payment Under Review' ? 'selected' : ''}>Payment Under Review</option>
                <option value="Paid / Confirmed" ${o.paymentStatus.includes('Paid') ? 'selected' : ''}>Paid / Confirmed</option>
                <option value="Payment Pending (COD)" ${o.paymentStatus.includes('COD') ? 'selected' : ''}>COD</option>
              </select>
            </td>
            <td class="p-4">
              <select onchange="updateOrderStatus('${o._id}', this.value)" class="text-xs font-bold px-2.5 py-1.5 rounded border outline-none bg-white">
                <option value="Pending" ${o.status === 'Pending' ? 'selected' : ''}>Pending</option>
                <option value="Processing" ${o.status === 'Processing' ? 'selected' : ''}>Processing</option>
                <option value="Shipped" ${o.status === 'Shipped' ? 'selected' : ''}>Shipped</option>
                <option value="Delivered" ${o.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
                <option value="Cancelled" ${o.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
                <option value="ARTO Reviewing" ${o.status === 'ARTO Reviewing' ? 'selected' : ''}>ARTO Reviewing</option>
                <option value="Refund Reviewing" ${o.status === 'Refund Reviewing' ? 'selected' : ''}>Refund Reviewing</option>
              </select>
            </td>
          </tr>
        `;
      }).join('');
    }

    async function updateOrderStatus(id, status) {
      await fetch(`${BACKEND_URL}/api/admin/order-status/${id}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status }) });
      alert(`Order status updated to ${status}`);
    }

    async function updatePaymentStatus(id, paymentStatus) {
      await fetch(`${BACKEND_URL}/api/admin/payment-status/${id}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ paymentStatus }) });
      alert(`Payment status updated to ${paymentStatus}`);
    }

    function openProductModal(id = null) {
      const modal = document.getElementById('admin-product-modal'), form = document.getElementById('product-form'), title = document.getElementById('modal-title'), deleteBtn = document.getElementById('delete-btn');
      form.reset(); document.getElementById('prod-id').value = ''; document.getElementById('image-preview').src = 'https://via.placeholder.com/150';
      if (id) {
        const p = adminProducts.find(x => x.id === id);
        title.innerText = 'Edit Product'; document.getElementById('prod-id').value = p.id; document.getElementById('prod-name').value = p.name;
        document.getElementById('prod-category').value = p.category; document.getElementById('prod-price').value = p.price;
        document.getElementById('prod-orig-price').value = p.origPrice || ''; document.getElementById('prod-stock').value = p.stockCount ?? 10;
        document.getElementById('prod-desc').value = p.description || ''; document.getElementById('prod-image').value = p.image;
        document.getElementById('image-preview').src = p.image; document.getElementById('prod-bestseller').checked = p.bestSeller;
        deleteBtn.classList.remove('hidden');
      } else { title.innerText = 'Add New Product'; document.getElementById('prod-stock').value = 10; deleteBtn.classList.add('hidden'); }
      modal.classList.remove('hidden');
    }
    function closeProductModal() { document.getElementById('admin-product-modal').classList.add('hidden'); }
    document.getElementById('prod-image').addEventListener('input', (e) => { document.getElementById('image-preview').src = e.target.value || 'https://via.placeholder.com/150'; });

    async function saveProduct(e) {
      e.preventDefault();
      const id = document.getElementById('prod-id').value;
      const data = {
        name: document.getElementById('prod-name').value, category: document.getElementById('prod-category').value,
        price: Number(document.getElementById('prod-price').value), origPrice: Number(document.getElementById('prod-orig-price').value),
        stockCount: Number(document.getElementById('prod-stock').value), description: document.getElementById('prod-desc').value,
        image: document.getElementById('prod-image').value, bestSeller: document.getElementById('prod-bestseller').checked
      };
      await fetch(id ? `${BACKEND_URL}/api/admin/products/${id}` : `${BACKEND_URL}/api/admin/products`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
      alert('Saved successfully!'); closeProductModal(); fetchAdminProducts();
    }

    async function deleteProduct() {
      const id = document.getElementById('prod-id').value;
      if (!confirm('Delete this product permanently?')) return;
      await fetch(`${BACKEND_URL}/api/admin/products/${id}`, { method: 'DELETE' });
      alert('Deleted.'); closeProductModal(); fetchAdminProducts();
    }
  </script>
</body>
</html>
