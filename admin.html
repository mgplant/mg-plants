<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MG Plants | Secure Admin Control Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { brand: { 50: '#f0fdf4', 500: '#22c55e', 700: '#15803d', 900: '#14532d' } } } }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-gray-100 text-gray-800 antialiased h-screen overflow-hidden">

  <!-- PASSWORD GATE (Clean & Hidden Hint) -->
  <div id="passwordGate" class="flex items-center justify-center h-full w-full bg-gray-900 absolute inset-0 z-50">
    <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-sm w-full text-center">
      <div class="w-12 h-12 bg-brand-50 text-brand-700 rounded-xl flex items-center justify-center mx-auto mb-4 text-xl">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h2 class="text-xl font-extrabold mb-2 text-gray-900">Admin Access</h2>
      <p class="text-xs text-gray-500 mb-6">Enter your security password to continue.</p>
      <input type="password" id="adminPass" class="w-full p-3 border-2 border-gray-200 rounded-xl mb-4 text-center text-lg outline-none focus:border-brand-500" placeholder="Password" />
      <button onclick="checkPassword()" class="w-full py-3 bg-brand-700 hover:bg-brand-800 text-white font-bold rounded-xl shadow-lg transition">Unlock</button>
    </div>
  </div>

  <!-- SECURE DASHBOARD CONTENT -->
  <div id="adminContent" class="hidden h-full flex overflow-hidden">
    <aside class="w-64 bg-gray-900 text-white flex flex-col h-full hidden md:flex">
      <div class="p-6 border-b border-gray-800">
        <span class="text-lg font-extrabold tracking-tight flex items-center gap-2">
          <i class="fa-solid fa-leaf text-brand-500"></i> MG Plants Owner
        </span>
      </div>
      <nav class="flex-1 p-4 space-y-1.5 overflow-y-auto text-sm">
        <button onclick="switchAdminTab('orders')" id="nav-orders" class="admin-nav w-full text-left px-4 py-3 bg-brand-700 text-white font-bold rounded-xl transition flex items-center gap-3"><i class="fa-solid fa-box w-5"></i> Live Orders</button>
      </nav>
      <div class="p-4 border-t border-gray-800">
        <a href="index.html" class="w-full block text-center px-4 py-2.5 bg-gray-800 hover:bg-gray-700 text-white text-xs font-bold rounded-lg transition">View Live Store <i class="fa-solid fa-external-link-alt ml-1"></i></a>
      </div>
    </aside>

    <main class="flex-1 flex flex-col h-full overflow-hidden bg-gray-50">
      <header class="bg-white border-b border-gray-200 p-4 sm:p-6 flex items-center justify-between z-10">
        <h1 id="pageTitle" class="text-xl sm:text-2xl font-extrabold text-gray-900">Customer Orders</h1>
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-brand-900 text-white flex items-center justify-center font-bold text-sm shadow">MG</div>
        </div>
      </header>

      <div class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-6">
        <div id="view-orders" class="admin-view space-y-4">
          <div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
            <div class="p-4 bg-gray-50 border-b font-bold text-xs text-gray-500 uppercase tracking-wider grid grid-cols-5 gap-4">
              <span>Customer & Phone</span>
              <span>Delivery Address</span>
              <span>Items</span>
              <span>Total & Status</span>
              <span>Time</span>
            </div>
            <div id="adminOrdersList" class="divide-y divide-gray-100">
              <div class="p-6 text-center text-gray-400">Loading orders...</div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const API_BASE_URL = 'https://mgplant-mg-plants-backend.onrender.com';

    function checkPassword() {
      const pass = document.getElementById('adminPass').value;
      if (pass === "mg555") {
        document.getElementById('passwordGate').classList.add('hidden');
        document.getElementById('adminContent').classList.remove('hidden');
        loadAdminOrders();
      } else {
        alert("Incorrect Password!");
      }
    }

    async function loadAdminOrders() {
      try {
        const res = await fetch(`${API_BASE_URL}/api/admin/orders`);
        const orders = await res.json();
        const container = document.getElementById('adminOrdersList');
        
        if (orders.length === 0) {
          container.innerHTML = `<div class="p-8 text-center text-gray-500 text-sm">No customer orders found yet.</div>`;
          return;
        }

        container.innerHTML = orders.map(o => `
          <div class="p-4 grid grid-cols-5 gap-4 items-center text-sm">
            <div>
              <p class="font-extrabold text-gray-900">${o.customerName}</p>
              <p class="text-xs text-brand-600 font-bold"><i class="fa-solid fa-phone"></i> ${o.phone}</p>
            </div>
            <div class="text-xs text-gray-600">${o.address}</div>
            <div>
              ${o.items.map(i => `<span class="block text-xs font-medium text-gray-700">• ${i.name} (x${i.qty})</span>`).join('')}
            </div>
            <div>
              <span class="font-extrabold text-gray-900 block">₹${o.totalAmount}</span>
              <span class="inline-block px-2 py-0.5 rounded text-[10px] font-bold ${o.status === 'Cancelled' ? 'bg-red-100 text-red-600' : 'bg-green-100 text-green-700'}">${o.status}</span>
            </div>
            <div>
              <span class="text-xs text-gray-400">${new Date(o.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error("Failed to load orders");
      }
    }

    function switchAdminTab(tabId) {
      document.getElementById('pageTitle').innerText = 'Customer Orders';
    }
  </script>
</body>
</html>
