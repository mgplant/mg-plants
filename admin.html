<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MG Plants - Admin Panel</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; background: #0f172a; color: #1e293b; }
        .admin-container { max-width: 1200px; margin: 20px auto; padding: 20px; background: #f8faf9; border-radius: 10px; }
        h2 { color: #0f172a; margin-top: 0; }
        
        /* Table Layout matching screenshot */
        .order-table { width: 100%; border-collapse: collapse; background: white; margin-top: 15px; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        th, td { padding: 14px 16px; text-align: left; font-size: 13px; border-bottom: 1px solid #e2e8f0; vertical-align: top; }
        th { background: #f1f5f9; color: #475569; font-weight: 700; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
        
        .customer-name { font-weight: bold; color: #0f172a; }
        .phone-text { color: #64748b; font-size: 12px; }
        .tracking-badge { display: inline-block; background: #fef3c7; color: #b45309; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-top: 4px; }
        
        .status-select { padding: 6px; border-radius: 4px; border: 1px solid #cbd5e1; font-size: 12px; font-weight: bold; background: #fff; margin-bottom: 6px; }
        .btn-save { background: #15803d; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; }
        .btn-save:hover { background: #16a34a; }
        
        .price-text { font-weight: bold; color: #0f172a; font-size: 14px; }
    </style>
</head>
<body>

<div class="admin-container">
    <h2>Customer Orders & Status Control</h2>
    
    <table class="order-table">
        <thead>
            <tr>
                <th>Customer & Tracking</th>
                <th>Address</th>
                <th>Items</th>
                <th>Payment & Delivery Manager</th>
                <th>Time</th>
            </tr>
        </thead>
        <tbody id="ordersTable">
            <!-- Dynamic rows will load here -->
        </tbody>
    </table>
</div>

<script>
    async function loadOrders() {
        const res = await fetch('/api/admin/orders');
        const orders = await res.json();
        const tbody = document.getElementById('ordersTable');
        tbody.innerHTML = '';

        if(orders.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#64748b; padding:20px;">No active orders found.</td></tr>`;
            return;
        }

        orders.forEach(o => {
            tbody.innerHTML += `
                <tr>
                    <td>
                        <div class="customer-name">${o.customerName || 'Mrinal Gayen'}</div>
                        <div class="phone-text">📞 ${o.phone || '508685'}</div>
                        <div class="tracking-badge">📦 ${o.trackingId}</div>
                    </td>
                    <td>
                        <div style="color: #334155; font-size: 12px;">[${o.paymentMethod}] Jejdl, Sjsj, Shhs, Whej - 711316</div>
                    </td>
                    <td>
                        <div style="font-size: 12px;">• ${o.productName} (x1)</div>
                    </td>
                    <td>
                        <div class="price-text">₹${o.totalAmount}</div>
                        <div style="margin-top: 6px;">
                            <select class="status-select" id="status-${o.orderId}">
                                <option value="Payment Pending" ${o.status === 'Payment Pending' ? 'selected' : ''}>⏳ Payment Pending</option>
                                <option value="Pending (COD)" ${o.status === 'Pending (COD)' ? 'selected' : ''}>💵 Pending (COD)</option>
                                <option value="Paid / Confirmed" ${o.status === 'Paid / Confirmed' ? 'selected' : ''}>✅ Paid / Confirmed</option>
                                <option value="ARTO Return Requested" ${o.status.includes('ARTO') ? 'selected' : ''}>🔄 ARTO Request</option>
                                <option value="Refund Processed" ${o.status === 'Refund Processed' ? 'selected' : ''}>💸 Refund Processed (48h)</option>
                            </select>
                            <br>
                            <button class="btn-save" onclick="updateStatus('${o.orderId}')">Update Status</button>
                        </div>
                    </td>
                    <td style="color: #64748b; font-size: 12px;">
                        ${o.orderDate}
                    </td>
                </tr>
            `;
        });
    }

    async function updateStatus(orderId) {
        const newStatus = document.getElementById(`status-${orderId}`).value;
        const res = await fetch('/api/admin/update-order', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ orderId, newStatus })
        });
        const data = await res.json();
        if(data.success) {
            alert('Order status successfully updated!');
            loadOrders();
        }
    }

    loadOrders();
</script>

</body>
</html>
