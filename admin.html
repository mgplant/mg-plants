<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MG Plants | Secure Admin Control</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-gray-900 h-screen">

  <!-- PASSWORD GATE -->
  <div id="passwordGate" class="flex items-center justify-center h-full">
    <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-sm w-full text-center">
      <h2 class="text-xl font-extrabold mb-6 text-gray-900">🔒 MG Plants Admin</h2>
      <input type="password" id="adminPass" class="w-full p-3 border-2 border-gray-200 rounded-xl mb-4 text-center text-lg outline-none focus:border-green-500" placeholder="Enter Password" />
      <button onclick="checkPassword()" class="w-full py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-xl shadow-lg transition">Unlock Dashboard</button>
    </div>
  </div>

  <!-- DASHBOARD CONTENT -->
  <div id="adminContent" class="hidden flex h-full overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-gray-900 text-white flex flex-col h-full">
      <div class="p-6 border-b border-gray-800 font-extrabold text-green-500 text-lg">MG PLANTS ADMIN</div>
      <nav class="flex-1 p-4 space-y-2">
        <button onclick="switchAdminTab('dashboard')" id="nav-dashboard" class="w-full text-left px-4 py-3 bg-green-700 text-white font-bold rounded-xl flex items-center gap-3"><i class="fa-solid fa-chart-line"></i> Dashboard</button>
        <button onclick="switchAdminTab('orders')" id="nav-orders" class="w-full text-left px-4 py-3 text-gray-400 hover:bg-gray-800 font-bold rounded-xl flex items-center gap-3"><i class="fa-solid fa-box"></i> Orders</button>
      </nav>
    </aside>

    <!-- Main View -->
    <main class="flex-1 bg-gray-50 p-8 overflow-y-auto">
      <h1 id="pageTitle" class="text-2xl font-extrabold mb-6">Dashboard Overview</h1>
      <div id="view-dashboard" class="admin-view grid grid-cols-4 gap-4">
        <div class="bg-white p-6 rounded-2xl border shadow-sm">
          <p class="text-xs font-bold text-gray-500 uppercase">Today's Sales</p>
          <h3 class="text-2xl font-extrabold">₹0</h3>
        </div>
      </div>
      <div id="view-orders" class="admin-view hidden bg-white p-6 rounded-2xl border shadow-sm">
        <p class="text-gray-500">No new orders yet.</p>
      </div>
    </main>
  </div>

  <script>
    function checkPassword() {
      const pass = document.getElementById('adminPass').value;
      if (pass === "mg555") {
        document.getElementById('passwordGate').classList.add('hidden');
        document.getElementById('adminContent').classList.remove('hidden');
      } else {
        alert("Incorrect Password!");
      }
    }

    function switchAdminTab(tabId) {
      document.querySelectorAll('.admin-view').forEach(v => v.classList.add('hidden'));
      document.getElementById(`view-${tabId}`).classList.remove('hidden');
      document.getElementById('pageTitle').innerText = tabId === 'dashboard' ? 'Dashboard Overview' : 'Order Management';
    }
  </script>
</body>
</html>
