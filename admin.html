<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MG Plants | Live Admin Orders</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-gray-100 text-gray-800 h-screen flex overflow-hidden">

  <!-- PASSWORD GATE -->
  <div id="passwordGate" class="flex items-center justify-center h-full w-full bg-gray-900 absolute inset-0 z-50">
    <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-sm w-full text-center">
      <h2 class="text-xl font-extrabold mb-4 text-gray-900">🔒 Admin Access</h2>
      <input type="password" id="adminPass" class="w-full p-3 border rounded-xl mb-4 text-center text-lg outline-none" placeholder="Enter Password (mg555)" />
      <button onclick="checkPassword()" class="w-full py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-xl shadow">Unlock</button>
    </div>
  </div>

  <!-- DASHBOARD CONTENT -->
  <div id="adminContent" class="hidden flex h-full w-full overflow-hidden">
    <aside class="w-64 bg-gray-900 text-white flex flex-col h-full">
      <div class="p-6 border-b border-gray-800 font-extrabold text-green-500">MG PLANTS OWNER</div>
      <nav class="flex-1 p-4 space-y-2">
        <button onclick="loadAdminOrders()" class="w-full text-left px-4 py-3 bg-green-700 text-white font-bold rounded-xl flex items-center gap-3"><i class="fa-solid fa-box"></i> Live Customer Orders</button>
      </nav>
      <div class="p-4 border-t border-gray-800">
        <a href="index.html" class="block text-center px-4 py-2 bg-gray-800 text-white text-xs font-bold rounded-lg">View Store</a>
      </div>
    </aside>

    <main class="flex-1 bg-gray-50 p-8 overflow-y-auto">
      <h1 class="text-2xl font-extrabold mb-6">Customer Orders & Delivery Management</h1>
      <div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
        <div class="p-4 bg-gray-50 border-b font-bold text-sm text-gray-700 grid grid-cols-5 gap-4">
          <span>Customer & Phone</span>
          <span>Delivery Address</span>
          <span>Items</span>
          <span>Total & Status</span>
          <span>Action</span>
        </div>
        <div id="adminOrdersList" class="divide-y divide-gray-100">
          <div class="p-6 text-center text-gray-400">Loading orders...</div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const API_BASE_URL = 'https://mgplant-mg-plants-backend.onrender.com';

    function checkPassword() {
      if (document.getElementById('adminPass').value === "mg555") {
        document.getElementById('passwordGate').classList.add('hidden');
        document.getElementById('adminContent').classList.remove('hidden');
        loadAdminOrders();
      } else { alert("Incorrect password!"); }
    }

    async function loadAdminOrders() {
      try {
        const res = await fetch(`${API_BASE_URL}/api/admin/orders`);
        const orders = await res.json();
        const container = document.getElementById('adminOrdersList');
        
        if (orders.length === 0) {
          container.innerHTML = `<div class="p-8 text-center text-gray-500">No customer orders found yet. Try placing one on your website!</div>`;
          return;
        }

        container.innerHTML = orders.map(o => `
          <div class="p-4 grid grid-cols-5 gap-4 items-center text-sm">
            <div>
              <p class="font-extrabold text-gray-900">${o.customerName}</p>
              <p class="text-xs text-brand-600 font-bold"><i class="fa-solid fa-phone"></i> ${o.phone}</p>
            </div>
            <div class="text-xs text-gray-600">${o.address}</div>
            <div>
              ${o.items.map(i => `<span class="block text-xs font-medium text-gray-700">• ${i.name} (x${i.qty})</span>`).join('')}
            </div>
            <div>
              <span class="font-extrabold text-gray-900 block">₹${o.totalAmount}</span>
              <span class="inline-block px-2 py-0.5 rounded text-[10px] font-bold ${o.status === 'Cancelled' ? 'bg-red-100 text-red-600' : 'bg-green-100 text-green-700'}">${o.status}</span>
            </div>
            <div>
              <span class="text-xs text-gray-400">${new Date(o.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error("Failed to load orders");
      }
    }
  </script>
</body>
</html>
