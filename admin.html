<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MG Plants - Admin Panel</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f8faf9; color: #1e293b; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        th, td { padding: 12px; border: 1px solid #cbd5e1; text-align: left; font-size: 13px; }
        th { background: #15803d; color: white; }
        select, button { padding: 6px; font-size: 12px; }
        button { background: #15803d; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<h2>Admin Panel - Order & Refund Control (ARTO)</h2>
<table>
    <thead>
        <tr>
            <th>Order ID</th>
            <th>Tracking ID</th>
            <th>Product & Total</th>
            <th>Payment</th>
            <th>Status / ARTO</th>
            <th>Refund Status (48h SLA)</th>
            <th>Update Action</th>
        </tr>
    </thead>
    <tbody id="ordersTable"></tbody>
</table>

<script>
    async function loadOrders() {
        const res = await fetch('/api/admin/orders');
        const orders = await res.json();
        const tbody = document.getElementById('ordersTable');
        tbody.innerHTML = '';

        orders.forEach(o => {
            tbody.innerHTML += `
                <tr>
                    <td>${o.orderId}</td>
                    <td><strong>${o.trackingId}</strong></td>
                    <td>${o.productName}<br>₹${o.totalAmount}</td>
                    <td>${o.paymentMethod}</td>
                    <td><span style="color:${o.returnRequested ? 'red':'inherit'};">${o.status}</span></td>
                    <td>${o.refundStatus}</td>
                    <td>
                        <select id="status-${o.orderId}">
                            <option value="Paid / Confirmed">Paid / Confirmed</option>
                            <option value="Shipped">Shipped</option>
                            <option value="Delivered">Delivered</option>
                            <option value="ARTO Approved">ARTO Approved</option>
                            <option value="Refund Processed">Process Refund (48h SLA)</option>
                            <option value="Cancelled">Cancelled</option>
                        </select>
                        <button onclick="updateStatus('${o.orderId}')">Save</button>
                    </td>
                </tr>
            `;
        });
    }

    async function updateStatus(orderId) {
        const newStatus = document.getElementById(`status-${orderId}`).value;
        await fetch('/api/admin/update-order', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ orderId, newStatus })
        });
        alert('Order updated successfully!');
        loadOrders();
    }

    loadOrders();
</script>

</body>
</html>
