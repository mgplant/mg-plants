<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MG Plants | Premium Nursery & Seeds</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { brand: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 700: '#15803d', 800: '#166534', 900: '#14532d' } } } }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } .hide-scrollbar::-webkit-scrollbar { display: none; } </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased flex flex-col min-h-screen">

  <!-- HEADER NAVIGATION -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-gray-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-18 py-3 gap-4">
      
      <!-- Logo -->
      <a href="#" onclick="switchTab('home')" class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-700 to-brand-500 flex items-center justify-center text-white shadow-md">
          <i class="fa-solid fa-leaf text-lg"></i>
        </div>
        <div>
          <span class="text-xl font-extrabold text-gray-900 tracking-tight">MG Plants <span class="w-1.5 h-1.5 rounded-full bg-brand-500 inline-block"></span></span>
        </div>
      </a>

      <!-- Primary Nav -->
      <nav class="hidden lg:flex items-center gap-2 text-sm font-bold">
        <button onclick="switchTab('home')" id="nav-home" class="nav-item px-3 py-2 text-brand-700 transition">Home</button>
        <button onclick="switchTab('shop')" id="nav-shop" class="nav-item px-3 py-2 text-gray-600 hover:text-brand-600 transition">All Categories</button>
        <button onclick="switchTab('shop')" class="px-3 py-2 text-gray-600 hover:text-brand-600 transition">Today's Deals</button>
        <button onclick="switchTab('shop')" class="px-3 py-2 text-gray-600 hover:text-brand-600 transition">New Releases</button>
      </nav>

      <!-- Account & Cart -->
      <div class="flex items-center gap-2 sm:gap-4">
        <button onclick="handleAccountClick()" id="nav-login" class="nav-item p-2.5 text-gray-600 hover:text-brand-600 transition flex items-center gap-2 cursor-pointer">
          <i class="fa-regular fa-circle-user text-xl"></i><span class="font-bold text-sm hidden sm:inline">Sign In</span>
        </button>
        <button onclick="toggleCartDrawer(true)" class="relative p-2.5 bg-brand-50 hover:bg-brand-100 text-brand-700 rounded-xl transition flex items-center gap-2">
          <i class="fa-solid fa-cart-shopping text-lg"></i>
          <span id="cartCountBadge" class="absolute -top-1 -right-1 w-5 h-5 bg-brand-600 text-white text-[10px] font-bold rounded-full flex items-center justify-center shadow border-2 border-white">0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1">
    
    <!-- HOME TAB -->
    <div id="view-home" class="page-view">
      <section class="max-w-7xl mx-auto px-4 py-8">
        <div class="flex items-end justify-between mb-6">
          <h2 class="text-2xl font-extrabold text-gray-900"><i class="fa-solid fa-fire text-brand-600 mr-2"></i>Best Sellers</h2>
          <button onclick="switchTab('shop')" class="text-brand-700 font-bold text-sm">View All <i class="fa-solid fa-arrow-right"></i></button>
        </div>
        <div id="bestsellersGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
      </section>
    </div>

    <!-- SHOPPING TAB -->
    <div id="view-shop" class="page-view hidden">
      <section class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- Search & Filter Bar -->
        <div class="mb-6 flex flex-col md:flex-row gap-4 justify-between">
          <div class="relative w-full md:w-96">
            <input type="text" id="searchInput" oninput="handleSearch(this.value)" placeholder="Search products, seeds, plants..." class="w-full pl-10 pr-4 py-2.5 bg-white border border-gray-300 rounded-xl text-sm outline-none focus:border-brand-500 shadow-sm" />
            <i class="fa-solid fa-search absolute left-3.5 top-3.5 text-gray-400"></i>
          </div>
          
          <div class="flex items-center gap-2 overflow-x-auto hide-scrollbar">
            <button onclick="filterCategory('all')" class="cat-pill active px-4 py-2 rounded-full text-xs font-bold bg-brand-700 text-white">All Products</button>
            <button onclick="filterCategory('Indoor Plants')" class="cat-pill px-4 py-2 rounded-full text-xs font-bold bg-white text-gray-700 border">Indoor Plants</button>
            <button onclick="filterCategory('Fruit Plants')" class="cat-pill px-4 py-2 rounded-full text-xs font-bold bg-white text-gray-700 border">Fruit Saplings</button>
            <button onclick="filterCategory('Seeds')" class="cat-pill px-4 py-2 rounded-full text-xs font-bold bg-white text-gray-700 border">Seeds</button>
          </div>
        </div>

        <div id="catalogGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
      </section>
    </div>

    <!-- LOGIN / REGISTER TAB -->
    <div id="view-login" class="page-view hidden">
      <section class="max-w-md mx-auto px-4 py-16">
        <div class="bg-white rounded-2xl border border-gray-200 p-8 shadow-sm">
          <div class="flex bg-gray-100 rounded-lg p-1 mb-6">
            <button id="tabSignIn" onclick="toggleAuthMode('signin')" class="flex-1 py-2 text-sm font-bold rounded-md bg-white text-brand-700 shadow-sm">Sign In</button>
            <button id="tabSignUp" onclick="toggleAuthMode('signup')" class="flex-1 py-2 text-sm font-bold rounded-md text-gray-500">Create Account</button>
          </div>
          <div id="formSignIn" class="space-y-4">
            <input type="email" id="loginEmail" placeholder="Email Address" class="w-full p-2.5 bg-gray-50 border rounded-lg text-sm" />
            <input type="password" id="loginPassword" placeholder="Password" class="w-full p-2.5 bg-gray-50 border rounded-lg text-sm" />
            <button onclick="attemptLogin()" class="w-full py-3 bg-brand-700 text-white font-bold rounded-xl shadow-lg">Secure Sign In</button>
          </div>
          <div id="formSignUp" class="space-y-4 hidden">
            <input type="text" id="regName" placeholder="Full Name" class="w-full p-2.5 bg-gray-50 border rounded-lg text-sm" />
            <input type="email" id="regEmail" placeholder="Email Address" class="w-full p-2.5 bg-gray-50 border rounded-lg text-sm" />
            <input type="password" id="regPassword" placeholder="Create Password" class="w-full p-2.5 bg-gray-50 border rounded-lg text-sm" />
            <button onclick="attemptRegister()" class="w-full py-3 bg-gray-900 text-white font-bold rounded-xl shadow-lg">Create Account</button>
          </div>
        </div>
      </section>
    </div>

    <!-- ACCOUNT DASHBOARD TAB (With Orders & 4-Hour Cancellation) -->
    <div id="view-account" class="page-view hidden">
      <section class="max-w-7xl mx-auto px-4 py-8">
        <div class="flex flex-col md:flex-row gap-8">
          
          <div class="w-full md:w-64 space-y-2">
            <div class="p-4 bg-white border border-gray-200 rounded-2xl mb-4 text-center">
              <div id="accAvatar" class="w-16 h-16 mx-auto bg-brand-100 text-brand-700 rounded-full flex items-center justify-center text-2xl font-bold mb-2">U</div>
              <h3 id="accName" class="font-bold text-gray-900">User Name</h3>
              <p id="accEmail" class="text-xs text-gray-500">user@email.com</p>
            </div>
            
            <button class="w-full text-left px-4 py-3 bg-brand-50 text-brand-700 font-bold rounded-xl"><i class="fa-solid fa-box w-6"></i> My Orders</button>
            <button class="w-full text-left px-4 py-3 text-gray-600 hover:bg-gray-100 font-bold rounded-xl transition"><i class="fa-solid fa-location-dot w-6"></i> Addresses</button>
            <button class="w-full text-left px-4 py-3 text-gray-600 hover:bg-gray-100 font-bold rounded-xl transition"><i class="fa-solid fa-heart w-6"></i> Wishlist</button>
            <button onclick="logoutUser()" class="w-full text-left px-4 py-3 text-red-500 hover:bg-red-50 font-bold rounded-xl mt-4 transition"><i class="fa-solid fa-right-from-bracket w-6"></i> Sign Out</button>
          </div>

          <div class="flex-1 bg-white border border-gray-200 rounded-2xl p-6">
            <h3 class="text-xl font-extrabold text-gray-900 mb-4">My Orders & Recent Purchases</h3>
            <div id="customerOrdersList" class="space-y-4">
              <p class="text-gray-400 text-sm">Loading your orders...</p>
            </div>
          </div>

        </div>
      </section>
    </div>

  </main>

  <!-- CART DRAWER WITH CHECKOUT FORM -->
  <div id="cartDrawerBackdrop" onclick="toggleCartDrawer(false)" class="fixed inset-0 z-50 bg-black/50 hidden"></div>
  <div id="cartDrawer" class="fixed right-0 top-0 bottom-0 z-50 w-full max-w-md bg-white shadow-2xl flex flex-col transform translate-x-full transition-transform duration-300">
    <div class="p-5 border-b border-gray-200 flex justify-between items-center bg-gray-50">
      <h3 class="font-extrabold text-lg text-gray-900 flex items-center gap-2"><i class="fa-solid fa-cart-shopping text-brand-600"></i> Shopping Cart</h3>
      <button onclick="toggleCartDrawer(false)" class="w-8 h-8 rounded-full bg-white border border-gray-200 flex items-center justify-center text-gray-500 hover:text-gray-900 shadow-sm"><i class="fa-solid fa-xmark"></i></button>
    </div>
    
    <div id="cartDrawerItems" class="flex-1 overflow-y-auto p-5 space-y-4"></div>
    
    <div class="p-5 border-t border-gray-200 bg-white shadow-[0_-10px_30px_rgba(0,0,0,0.05)] space-y-4 relative z-10">
      <div class="flex justify-between text-lg font-extrabold text-gray-900 border-b border-gray-100 pb-3">
        <span>Subtotal</span>
        <span id="cartTotal" class="text-brand-700">₹0</span>
      </div>
      
      <!-- Address & Buy Form -->
      <div id="checkoutFormSection" class="hidden space-y-3 pt-2">
        <input type="text" id="custName" placeholder="Full Name *" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:border-brand-500 focus:bg-white" required />
        <input type="tel" id="custPhone" placeholder="Mobile Number *" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:border-brand-500 focus:bg-white" required />
        <textarea id="custAddress" placeholder="Delivery Address & PIN *" rows="2" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:border-brand-500 focus:bg-white" required></textarea>
        <button onclick="submitOrderToBackend()" class="w-full py-3.5 bg-brand-700 hover:bg-brand-800 text-white font-bold rounded-xl shadow-lg transition text-base">
          Place Secure Order <i class="fa-solid fa-lock ml-1 text-sm"></i>
        </button>
      </div>

      <button id="proceedCheckoutBtn" onclick="openCheckoutForm()" class="w-full py-3.5 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl shadow-lg transition flex items-center justify-center gap-2 text-base">
        Proceed to Checkout <i class="fa-solid fa-arrow-right text-sm"></i>
      </button>
    </div>
  </div>

  <script>
    const API_BASE_URL = 'https://mgplant-mg-plants-backend.onrender.com';
    let productsDB = []; let cart = []; let selectedCategory = 'all';
    let currentUser = JSON.parse(localStorage.getItem('mgPlantsUser'));

    document.addEventListener('DOMContentLoaded', async () => {
      updateAuthUI();
      await fetchLiveCatalog();
    });

    function createProductCardHTML(product) {
      return `
        <div class="bg-white rounded-2xl border border-gray-200 p-3 hover:shadow-xl hover:-translate-y-1 transition-all duration-300 flex flex-col relative group">
          ${product.bestSeller ? '<span class="absolute top-4 left-4 z-10 bg-gradient-to-r from-amber-500 to-orange-500 text-white text-[10px] font-extrabold px-2 py-1 rounded shadow-md">POPULAR</span>' : ''}
          <div class="relative aspect-square rounded-xl overflow-hidden bg-gray-100 mb-3">
            <img src="${product.image}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" />
          </div>
          <div class="flex-1">
            <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">${product.category}</span>
            <h4 class="font-bold text-gray-900 text-sm leading-snug mt-1">${product.name}</h4>
          </div>
          <div class="flex items-center justify-between mt-4 pt-3 border-t border-gray-100">
            <div>
              <span class="text-lg font-extrabold text-gray-900">₹${product.price}</span>
              ${product.origPrice ? `<span class="text-xs text-gray-400 line-through ml-1 block sm:inline">₹${product.origPrice}</span>` : ''}
            </div>
            <button onclick="addToCart('${product.id}')" class="w-10 h-10 rounded-xl bg-brand-50 hover:bg-brand-600 text-brand-700 hover:text-white flex items-center justify-center transition shadow-sm">
              <i class="fa-solid fa-plus"></i>
            </button>
          </div>
        </div>`;
    }

    async function fetchLiveCatalog() {
      try {
        const response = await fetch(`${API_BASE_URL}/api/products`);
        productsDB = await response.json();
        renderBestsellers(); renderShopCatalog();
      } catch (err) { console.warn("Backend offline"); }
    }
    function renderBestsellers() {
      document.getElementById('bestsellersGrid').innerHTML = productsDB.filter(p => p.bestSeller).slice(0, 8).map(createProductCardHTML).join('');
    }
    function renderShopCatalog() {
      let filtered = selectedCategory === 'all' ? productsDB : productsDB.filter(p => p.category === selectedCategory);
      document.getElementById('catalogGrid').innerHTML = filtered.map(createProductCardHTML).join('');
    }
    function handleSearch(query) {
      const q = query.toLowerCase();
      const filtered = productsDB.filter(p => p.name.toLowerCase().includes(q) || p.category.toLowerCase().includes(q));
      document.getElementById('catalogGrid').innerHTML = filtered.map(createProductCardHTML).join('');
    }

    function addToCart(id) {
      const product = productsDB.find(p => p.id === id);
      const existing = cart.find(i => i.id === id);
      if(existing) existing.qty += 1; else cart.push({ ...product, qty: 1 });
      updateCartUI();
      toggleCartDrawer(true);
    }
    function updateQuantity(id, delta) {
      const item = cart.find(i => i.id === id);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
      updateCartUI();
    }
    function updateCartUI() {
      const count = cart.reduce((s, i) => s + i.qty, 0);
      const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
      document.getElementById('cartCountBadge').innerText = count;
      document.getElementById('cartTotal').innerText = `₹${total}`;
      
      const container = document.getElementById('cartDrawerItems');
      if (cart.length === 0) {
        container.innerHTML = `<div class="text-center py-16"><p class="text-gray-500 font-medium text-sm">Your cart is empty.</p></div>`;
        document.getElementById('checkoutFormSection').classList.add('hidden');
        document.getElementById('proceedCheckoutBtn').classList.remove('hidden');
        return;
      }
      container.innerHTML = cart.map(item => `
        <div class="flex gap-4 p-3 bg-white rounded-xl border border-gray-100 items-center shadow-sm">
          <img src="${item.image}" class="w-16 h-16 object-cover rounded-lg border" />
          <div class="flex-1">
            <h5 class="font-bold text-sm text-gray-900">${item.name}</h5>
            <span class="text-sm font-extrabold text-brand-700">₹${item.price}</span>
          </div>
          <div class="flex items-center gap-2 bg-gray-50 px-2 py-1.5 rounded-lg border">
            <button onclick="updateQuantity('${item.id}', -1)" class="w-6 h-6 rounded flex items-center justify-center font-bold hover:bg-white text-red-500">-</button>
            <span class="text-xs font-bold text-gray-900 w-4 text-center">${item.qty}</span>
            <button onclick="updateQuantity('${item.id}', 1)" class="w-6 h-6 rounded flex items-center justify-center font-bold hover:bg-white text-brand-600">+</button>
          </div>
        </div>`).join('');
    }
    function toggleCartDrawer(open) {
      document.getElementById('cartDrawerBackdrop').classList.toggle('hidden', !open);
      document.getElementById('cartDrawer').classList.toggle('translate-x-full', !open);
    }
    function openCheckoutForm() {
      if (cart.length === 0) return alert("Cart is empty!");
      document.getElementById('checkoutFormSection').classList.remove('hidden');
      document.getElementById('proceedCheckoutBtn').classList.add('hidden');
      if (currentUser) {
        document.getElementById('custName').value = currentUser.name;
      }
    }

    async function submitOrderToBackend() {
      const name = document.getElementById('custName').value;
      const phone = document.getElementById('custPhone').value;
      const address = document.getElementById('custAddress').value;
      if (!name || !phone || !address) return alert("Please fill all address and mobile fields!");
      
      const totalAmount = cart.reduce((s, i) => s + (i.price * i.qty), 0);

      try {
        const res = await fetch(`${API_BASE_URL}/api/orders`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ customerName: name, phone, address, items: cart, totalAmount })
        });
        const data = await res.json();
        if (data.success) {
          alert(`🌿 Order received! We will contact ${phone} for delivery.`);
          cart = []; updateCartUI(); toggleCartDrawer(false);
        } else { alert("Error saving order."); }
      } catch (err) { alert("Server error connecting to database."); }
    }

    async function loadCustomerOrders() {
      if (!currentUser) return;
      try {
        const res = await fetch(`${API_BASE_URL}/api/admin/orders`);
        const orders = await res.json();
        const myOrders = orders.filter(o => o.customerName.toLowerCase() === currentUser.name.toLowerCase());
        const container = document.getElementById('customerOrdersList');
        
        if (myOrders.length === 0) {
          container.innerHTML = `<p class="text-gray-500 text-sm">You haven't placed any orders yet.</p>`;
          return;
        }

        container.innerHTML = myOrders.map(o => {
          const hoursElapsed = (Date.now() - new Date(o.createdAt).getTime()) / (1000 * 60 * 60);
          const canCancel = hoursElapsed <= 4 && o.status !== 'Cancelled';

          return `
            <div class="p-4 border rounded-xl bg-gray-50 space-y-2">
              <div class="flex justify-between items-center">
                <span class="text-xs font-bold text-gray-500">Order ID: ${o._id}</span>
                <span class="px-2 py-0.5 rounded text-[10px] font-bold ${o.status === 'Cancelled' ? 'bg-red-100 text-red-600' : 'bg-green-100 text-green-700'}">${o.status}</span>
              </div>
              <div class="text-sm font-bold text-gray-900">Total: ₹${o.totalAmount}</div>
              <div class="text-xs text-gray-600">Address: ${o.address}</div>
              ${canCancel ? `<button onclick="cancelOrder('${o._id}')" class="px-3 py-1 bg-red-600 text-white font-bold text-xs rounded-lg hover:bg-red-700">Cancel Order (Within 4 Hours)</button>` : ''}
            </div>
          `;
        }).join('');
      } catch (err) { console.error("Error loading customer orders"); }
    }

    async function cancelOrder(orderId) {
      if (!confirm("Are you sure you want to cancel this order?")) return;
      try {
        const res = await fetch(`${API_BASE_URL}/api/orders/cancel/${orderId}`, { method: 'POST' });
        const data = await res.json();
        alert(data.message);
        loadCustomerOrders();
      } catch (err) { alert("Error cancelling order."); }
    }

    function updateAuthUI() {
        const loginBtn = document.getElementById('nav-login');
        if (currentUser) {
            loginBtn.innerHTML = `<div class="w-8 h-8 rounded-full bg-brand-100 text-brand-700 flex items-center justify-center font-bold text-sm shadow-sm border border-brand-200">${currentUser.name.charAt(0).toUpperCase()}</div><span class="font-bold text-sm hidden sm:inline text-gray-800">Account</span>`;
            document.getElementById('accName').innerText = currentUser.name;
            document.getElementById('accEmail').innerText = currentUser.email;
            document.getElementById('accAvatar').innerText = currentUser.name.charAt(0).toUpperCase();
            loadCustomerOrders();
        } else {
            loginBtn.innerHTML = `<i class="fa-regular fa-circle-user text-xl"></i><span class="font-bold text-sm hidden sm:inline">Sign In</span>`;
        }
    }
    function handleAccountClick() {
        if (currentUser) { switchTab('account'); loadCustomerOrders(); } 
        else { switchTab('login'); }
    }
    function logoutUser() {
        if(confirm("Sign out?")) { localStorage.removeItem('mgPlantsUser'); currentUser = null; updateAuthUI(); switchTab('home'); }
    }
    async function attemptRegister() {
        const name = document.getElementById('regName').value, email = document.getElementById('regEmail').value, password = document.getElementById('regPassword').value;
        if (!name || !email || !password) return alert("Fill all fields.");
        try {
            const res = await fetch(`${API_BASE_URL}/api/register`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({name, email, password}) });
            const data = await res.json();
            if (data.success) { currentUser = data.user; localStorage.setItem('mgPlantsUser', JSON.stringify(data.user)); updateAuthUI(); switchTab('account'); }
            else alert(data.message);
        } catch(err) { alert("Server error."); }
    }
    async function attemptLogin() {
        const email = document.getElementById('loginEmail').value, password = document.getElementById('loginPassword').value;
        if (!email || !password) return alert("Enter email and password.");
        try {
            const res = await fetch(`${API_BASE_URL}/api/login`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({email, password}) });
            const data = await res.json();
            if (data.success) { currentUser = data.user; localStorage.setItem('mgPlantsUser', JSON.stringify(data.user)); updateAuthUI(); switchTab('account'); }
            else alert(data.message);
        } catch(err) { alert("Server error."); }
    }
    function toggleAuthMode(mode) {
      document.getElementById('formSignIn').classList.toggle('hidden', mode !== 'signin');
      document.getElementById('formSignUp').classList.toggle('hidden', mode !== 'signup');
      document.getElementById('tabSignIn').className = mode === 'signin' ? "flex-1 py-2 text-sm font-bold bg-white text-brand-700 shadow-sm" : "flex-1 py-2 text-sm font-bold text-gray-500";
      document.getElementById('tabSignUp').className = mode === 'signup' ? "flex-1 py-2 text-sm font-bold bg-white text-brand-700 shadow-sm" : "flex-1 py-2 text-sm font-bold text-gray-500";
    }

    function filterCategory(cat) { 
      selectedCategory = cat; 
      document.querySelectorAll('.cat-pill').forEach(btn => {
        if (btn.innerText === cat || (cat === 'all' && btn.innerText === 'All Products')) {
          btn.className = "cat-pill active px-4 py-2 rounded-full text-xs font-bold bg-brand-700 text-white transition";
        } else {
          btn.className = "cat-pill px-4 py-2 rounded-full text-xs font-bold bg-white text-gray-700 border hover:bg-gray-50 transition";
        }
      });
      renderShopCatalog(); 
    }
    function switchTab(tabId) {
      document.querySelectorAll('.page-view').forEach(v => v.classList.add('hidden'));
      document.getElementById(`view-${tabId}`).classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
